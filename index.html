<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metron</title>
  <link rel="icon" href="wow-gear/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --link: #6d28d9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --link: #c4b5fd; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 32rem; margin: 0 auto; padding: 3rem 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    p { color: var(--muted); margin: 0 0 2rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border-top: 1px solid var(--line); }
    li:last-child { border-bottom: 1px solid var(--line); }
    a { display: block; padding: .9rem 0; color: var(--link); text-decoration: none; font-weight: 600; }
    a span { display: block; color: var(--muted); font-weight: 400; font-size: .9rem; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Metron</h1>
    <p>TBC Anniversary · Thunderstrike-EU · Legaçy</p>
    <ul>
      <li><a href="wow-briefings/">Raid briefings<span>Boss guides, tonight's assignments, raid lead views</span></a></li>
      <li><a href="wow-gear/">Gear<span>Upgrades, gems &amp; enchants, soft reserves</span></a></li>
    </ul>
  </main>
</body>
</html>
